name: Publish release notes

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged version
        uses: actions/checkout@v4

      - name: Verify version and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -c 'import json, sys; assert json.load(open("custom_components/freshpoint/manifest.json"))["version"] == sys.argv[1], "Tag and manifest versions differ"' "$version"
          notes="release_notes/$version.md"
          test -s "$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
